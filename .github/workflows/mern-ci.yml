name: MERN CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Backend
        run: |
          cd backend
          npm install

      - name: Install Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Docker Image
        run: |
          cd backend
          docker build -t pranavvengatesh191103/mern-backend .

      - name: Push Backend Docker Image
        run: |
          docker push pranavvengatesh191103/mern-backend

      - name: Build Frontend Docker Image
        run: |
          cd frontend
          docker build -t pranavvengatesh191103/mern-frontend .

      - name: Push Frontend Docker Image
        run: |
          docker push pranavvengatesh191103/mern-frontend

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker stop mern-backend || true
            docker rm mern-backend || true
            docker stop mern-frontend || true
            docker rm mern-frontend || true

            docker pull pranavvengatesh191103/mern-backend
            docker pull pranavvengatesh191103/mern-frontend

            docker run -d -p 5000:5000 --name mern-backend pranavvengatesh191103/mern-backend
            docker run -d -p 80:80 --name mern-frontend pranavvengatesh191103/mern-frontend
